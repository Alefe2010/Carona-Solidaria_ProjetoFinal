<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BEM-VINDO</h1>
        <form action="" >
            <h2>Login</h2>
            <div class="main">
                <div class="form-group">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Nome do Usuário">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Senha">
                </div>
            </div>

            <div class="button-container">
                <button type="submit" id="entra">ENTRAR</button>
                <button type="reset" id="limpa">LIMPAR</button>
            </div>
        </form>
    </div>
    <script>
        const entra = document.getElementById("entra")
        entra.addEventListener("click", () => {
            alert("Entrou!")
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar oferta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding-left: 240px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #162556;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            padding: 16px 32px;
            border-bottom: 4px solid #e17100;
            margin-bottom: 30px;
        }

        section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px 40px;
            flex: 1;
        }

        form.coluna {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 28px;
            color: #162556;
            margin-bottom: 6px;
        }

        p {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .coluna-div {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #162556;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: 1.5px solid #d1d5db;
            background-color: #f9fafb;
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #e17100;
            box-shadow: 0 0 0 3px rgba(225, 113, 0, 0.18);
        }

        .linha-div {
            display: flex;
            flex-direction: row;
            gap: 16px;
            justify-content: center;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-criar {
            background-color: #162556;
            color: #ffffff;
        }

        .btn-criar:hover {
            background-color: #0f1a3d;
        }

        button[type="reset"] {
            background-color: #e5e7eb;
            color: #162556;
        }

        button[type="reset"]:hover {
            background-color: #d1d5db;
        }

        .lateral {
            width: 240px;
            height: 100vh;
            background-color: #162556;
            padding: 30px 20px;
            position: fixed;
            left: 0;
            top: 0;
        }

        .logo {
            color: white;
            font-size: 25px;
            margin-bottom: 45px;
            font-family: "Anton", sans-serif;
            text-align: center;
        }

        .menu h2 {
            color: white;
            font-size: 17px;
            margin: 0 0 15px;
        }

        .menu a {
            display: block;
            color: #cccccc;
            text-decoration: none;
            padding: 15px 12px;
            margin-bottom: 8px;
            border-radius: 7px;
            font-size: 14px;
        }

        .menu a:hover { background-color: #223574; color: white; }

        .menu a.ativo {
            background-color: #223574;
            color: white;
            box-shadow: inset 3px 0 0 #e17100;
        }

        .sair {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
        }

        .sair a {
            display: block;
            padding: 14px;
            text-align: center;
            background-color: #223574;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-size: 14px;
        }

        @media (max-width: 760px) {
            body { padding-left: 0; }
            .lateral { position: static; width: 100%; height: auto; padding: 20px; }
            .logo { margin-bottom: 20px; }
            .sair { position: static; margin-top: 12px; }
        }
    </style>
</head>
<body>
    <div class="lateral">

        <div class="logo">VaiJunto!</div>

        <nav class="menu">
            <h2>menu</h2>

            <a href="ofertas_corrida.html">ofertas</a>
            <a href="criacao_oferta.html" class="ativo">publicar oferta</a>
            <a href="veiculos.html">veículos</a>
            <a href="pontos_encontro.html">pontos de encontro</a>
            <a href="solicitacoes_recebidas.html">solicitações recebidas</a>
            <a href="historico.html">minhas corridas</a>
            <a href="minhas_ofertas.html">minhas ofertas</a>
            <a href="avaliacoes.html">avaliações</a>
            <a href="detalhe_usuario.html">meu perfil</a>
        </nav>

        <div class="sair">
            <a href="login.html">sair da conta</a>
        </div>

    </div>
    <section>
        <form action="" method="post" class="coluna">

            <div class="coluna-div">
                <h1>Criação de oferta</h1>
                <p>Escreva abaixo as informações da sua corrida.</p>
            </div>
            <div class="coluna-div">
                <label for="endereco_origem">Local de partida:</label>
                <input type="text" name="endereco_origem" id="endereco_origem" placeholder="Adicione o endereço" required>
            </div>
            <div class="coluna-div">
                <label for="endereco_destino">Local de destino:</label>
                <input type="text" name="endereco_destino" id="endereco_destino" placeholder="Adicione o endereço" required>
            </div>
            <div class="coluna-div">
                <label for="data_hora">Data e hora:</label>
                <input type="datetime-local" name="data_hora" id="data_hora" required>
            </div>
            <div class="coluna-div">
                <label for="vagas">Quantidade de vagas:</label>
                <input type="number" name="vagas" id="vagas" min="1" required>
            </div>

            <div class="linha-div">
                <button type="submit" class="btn-criar">Criar Oferta</button>
                <button type="reset">Limpar tudo</button>
            </div>
        </form>
        
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../public/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../assets/imagem_logo.png" alt="Imagem da logo">
            <h1>VaiJunto!</h1>
        </div>
        <form action="" >
            <div class="main">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Senha">
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Telefone">
                </div>
            </div>

            <button type="reset" id="forget">Esqueci a Senha</button>
            <div class="enter">
                <button type="submit" id="enterbtn">ENTRAR</button>
            </div>
        </form>
    </div>
    <script>
        const entra = document.getElementById("enterbtn")
        entra.addEventListener("click", () => {
            alert("Entrou!")
        })
    </script>
</body>
</html>

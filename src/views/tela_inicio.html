<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body {
            background-color: aliceblue;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container{
            display: flex;
            height: 70vh;
            border-radius: 2%;
        width: 80%;    /* limita a largura máxima para não esticar demais */
            margin: 0 auto; ;
            justify-content: center;
            align-items: center;
            box-shadow:0 2px 10px rgba(0,0.2,0,0.25);
            position: relative;

        }
        .goLogin {
            padding: 1rem;
            background: oklch(25.7% 0.09 281.288);
            height: 100%;
            color: #fff;
            flex: 1;
            text-align: center;
            border-radius: 10px 0 0 10px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .goSignin {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            padding: 1rem;
            background: #fff;
            height: 100%;
            color: oklch(25.7% 0.09 281.288);
            flex: 2;
            text-align: center;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.5rem;
            gap: 8px;
            margin-bottom: 4rem;          
        }
        #subtitle {
            font-size: 14px;
            margin-bottom: 2rem;
        }
        img {
            border-radius: 10%;
            width: 80px;
            height: 60px;
            box-shadow:0 0 10px rgba(0,0.2,0,0.25)
        }
        .text-login {
            margin-bottom: 6rem;
            font-size: 18px;
        }
        a{
            width:40%;
            border:none;
            cursor:pointer;
            margin-top: 1rem;
            text-decoration: none;
        }
        #logar {
            background: transparent;
            color: #fff;
            padding:8px;
            box-shadow:0 0 10px rgba(0,0.1,0,0.25);
            font-weight: 700;
            border-radius:5px;
            font-size: 15px;
            transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1) 150ms;
            border: #fff 2px solid;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="goLogin">
            <div class="header">
                <img src="/assets/imagem_logo.png" alt="">
                <h1>VaiJunto</h1>
            </div>
            <div class="text-login">
                <h2>Bem-vindo </h2>
                <h2>de volta!</h2>
                <p id="subtitle">Acesse sua conta agora mesmo</p>
            </div>
            <div class="log">
                <a id="logar" href="/auth/login">Fazer Login</a>
            </div>
        </div>

        <div class="goSignin">
            <h1>Crie sua conta</h1>
            <p>Preencha seus dados</p>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - VaiJunto</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body {
            background-color: aliceblue;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 60%; 
            min-height: 600px; 
            border-radius: 16px;
            overflow: hidden; /* Garante que os filhos respeitem o arredondamento */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .goLogin {
            flex: 0.8;
            padding: 2rem 1.5rem;
            background: oklch(25.7% 0.09 281.288);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Empurra o header pro topo e centraliza o resto */
            align-items: center;
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .header img {
            border-radius: 10px;
            width: 55px;
            height: 45px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .header h1 {
            font-size: 2rem;
        }

        .text-login {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0; /* Centraliza verticalmente no espaço restante */
            gap: 0.5rem;
        }

        .text-login h2 {
            font-size: 1.75rem;
            line-height: 1.2;
        }

        #subtitle {
            font-size: 0.95rem;
            opacity: 0.85;
            margin-top: 0.5rem;
        }

        #logar {
            display: inline-block;
            margin-top: 2.5rem;
            padding: 0.75rem 2rem;
            background: transparent;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            border: 2px solid #fff;
            border-radius: 8px;
            transition: all 250ms ease;
        }

        #logar:hover {
            background: #fff;
            color: oklch(25.7% 0.09 281.288);
        }

        /* LADO DIREITO (2/3 do espaço) */
        .goSignin {
            flex: 2;
            padding: 2.5rem 2rem;
            background: #fff;
            color: oklch(25.7% 0.09 281.288);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .goSignin h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .goSignin p {
            color: #666;
        }

        /* RESPONSIVIDADE PARA TABLETS E CELULARES */
        @media (max-width: 768px) {
            .container {
                flex-direction: column; /* Empilha um embaixo do outro */
                min-height: auto;
                max-width: 450px;
            }

            .goLogin, .goSignin {
                flex: none; /* Remove a proporção 1:2 para cada um ter sua altura natural */
                width: 100%;
                padding: 2rem 1.5rem;
            }

            .text-login {
                margin-top: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="goLogin">
            <div class="header">
                <img src="/assets/imagem_logo.png" alt="Logo VaiJunto">
                <h1>VaiJunto</h1>
            </div>
            
            <div class="text-login">
                <h2>Bem-vindo<br>de volta!</h2>
                <p id="subtitle">Acesse sua conta agora mesmo</p>
                <a id="logar" href="/auth/login">Fazer Login</a>
            </div>
        </div>

        <div class="goSignin">
            <h1>Crie sua conta</h1>
            <p>Preencha seus dados</p>
            <!-- Seus inputs de cadastro entram aqui -->
        </div>
    </div>
</body>
</html>
